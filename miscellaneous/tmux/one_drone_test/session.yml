name: simulation
root: ./
startup_window: rog_map
# pre_window: export UAV_NAME=uav1; export UAV_TYPE=x500
pre_window: export UAV_NAME=uav1; export UAV_TYPE=lr7pro; export REAL_UAV=false
windows:
  - spawn:
      layout: even-horizontal
      panes:
        - ros2 launch laser_uav_simulation gazebo.launch.py real_time:=1.0 world:=forest
        - ros2 launch laser_uav_simulation spawn_drones.launch.py spawn_drones_file:=./configs/spawn.yaml
  - api:
      layout: even-horizontal
      panes:
        - sleep 1; ros2 launch laser_uav_hw_api px4_api.launch.py real_uav:=false use_sim_time:=true
        - sleep 1; ros2 run laser_uav_simulation autostart.py
  - estimation_manager:
      layout: tiled
      panes:
          - sleep 1; ros2 launch laser_uav_managers estimation_manager.launch.py use_sim_time:=true
  - control_manager:
      layout: tiled
      panes:
        - sleep 1; ros2 launch laser_uav_managers control_manager.launch.py use_sim_time:=true
        - 'history -s ros2 service call /$UAV_NAME/hw_api/arm std_srvs/srv/Trigger {}'
        - 'history -s ros2 service call /$UAV_NAME/control_manager/takeoff std_srvs/srv/Trigger {}'
        - 'history -s ros2 service call /$UAV_NAME/control_manager/land std_srvs/srv/Trigger {}'
  - planning_manager:
      layout: tiled
      panes:
        - sleep 1; ros2 launch laser_uav_managers planning_manager.launch.py use_sim_time:=true
  - free_cmd:
      layout: tiled
      panes:
        - 'history -s ros2 topic pub -1 /$UAV_NAME/planning_manager/goto laser_msgs/msg/PoseWithHeading \"{position: {x: 0.0, y: 0.0, z: 1.5}, heading: 0.0}\"'
  - estimation:
      layout: even-horizontal
      panes:
        - sleep 9; ros2 topic echo /$UAV_NAME/estimation_manager/estimation --no-arr
  - rog_map:
      layout: even-horizontal
      panes:
        - sleep 3; ros2 launch rog_map run_rog_map.launch.py rog_map_config:=ogm_map.yaml use_sim_time:=true
        - ros2 run rviz_republisher rviz_republisher

